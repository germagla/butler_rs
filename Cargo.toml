[package]
name = "butler_rs"
version = "0.4.0"
edition = "2024"
default-run = "butler_rs"
description = "Discord operations bot for Minecraft server workflows and diagnostics."
repository = "https://github.com/germagla/butler_rs"
license = "MIT"
keywords = ["discord", "minecraft", "operations", "bot", "aternos"]

[dependencies]
headless_chrome = "1.0"
poise = { version = "0.6", default-features = false, features = ["cache", "chrono", "handle_panics"] }
serde = { version = "1", features = ["derive"] }
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "native_tls_backend"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
dotenvy = "0.15"
anyhow = "1"
chrono = "0.4"
font8x8 = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
rand = "0.8"
craftping = { version = "0.7", features = ["async-tokio"] }
serde_json = "1.0"
regex = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "rustls-tls"] }
url = "2"
