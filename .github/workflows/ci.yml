name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Audit dependencies
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --locked --all-targets --all-features

      - name: Test
        run: cargo test --locked --all-targets --all-features

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Docker build
        run: docker build -t butler_rs:ci .

      - name: Docker runtime smoke test
        run: |
          docker run --rm \
            -e DISCORD_TOKEN=test \
            -e SERVER_PROVIDER=pterodactyl \
            -e PTERODACTYL_PANEL_URL=https://example.com \
            -e PTERODACTYL_SERVER_ID=deadbeef \
            -e PTERODACTYL_API_TOKEN=test \
            butler_rs:ci butler_rs --check-config
